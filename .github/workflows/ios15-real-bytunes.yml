name: Build REAL ByeTunes for iOS 15.8.8

on:
  workflow_dispatch:
  push:
    branches: [temp/ios15-8-8-real-app]
    paths:
      - '.github/workflows/ios15-real-bytunes.yml'
      - 'triggers/ios15-real-bytunes.txt'
      - 'scripts/patch_ios15_compat.py'
      - 'MusicManager/**'
      - 'MusicManager.xcodeproj/**'

permissions:
  contents: read
  actions: read

env:
  PROJECT_FILE: MusicManager.xcodeproj
  SCHEME: MusicManager
  APP_DIR: MusicManager
  DEPLOYMENT_TARGET: '15.0'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Apply real-app iOS 15 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_ios15_compat.py
          git diff -- MusicManager | tee "$RUNNER_TEMP/ios15-source.patch"
          test -s "$RUNNER_TEMP/ios15-source.patch"

      - name: Install Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build real idevice dependency for iOS 15
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$APP_DIR/idevice.h" "$APP_DIR/libidevice_ffi.a"
          WORK="$RUNNER_TEMP/idevice"
          rm -rf "$WORK"
          git clone --depth 1 https://github.com/jkcoxson/idevice "$WORK"
          cd "$WORK"
          export IPHONEOS_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET"
          cargo build --release --locked --package idevice-ffi --target aarch64-apple-ios
          H="$(find . -name idevice.h -type f | head -n1)"
          A="$(find target -path '*aarch64-apple-ios/release/libidevice_ffi.a' -type f | head -n1)"
          test -n "$H"; test -n "$A"
          cp "$H" "$GITHUB_WORKSPACE/$APP_DIR/idevice.h"
          cp "$A" "$GITHUB_WORKSPACE/$APP_DIR/libidevice_ffi.a"
          printf '%s\n' '#import "idevice.h"' > "$GITHUB_WORKSPACE/$APP_DIR/Bridging-Header.h"
          lipo -info "$GITHUB_WORKSPACE/$APP_DIR/libidevice_ffi.a" || true

      - name: Build exact upstream app with iOS 15 minimum
        shell: bash
        run: |
          set -o pipefail
          DD="$RUNNER_TEMP/DerivedData"
          rm -rf "$DD"
          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DD" \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            ENABLE_BITCODE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Validate real ByeTunes bundle
        shell: bash
        run: |
          set -euo pipefail
          DD="$RUNNER_TEMP/DerivedData"
          APP="$(find "$DD/Build/Products" -type d -name 'MusicManager.app' | head -n1)"
          test -d "$APP"
          test -x "$APP/MusicManager"
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" 2>/dev/null || true)"
          echo "bundle=$BID display=$NAME"
          test "$BID" = 'com.EduAlexxis.MusicManager'
          test "$NAME" = 'ByeTunes'
          otool -l "$APP/MusicManager" | tee "$RUNNER_TEMP/otool.txt"
          python3 - <<'PY'
          import re, os
          s=open(os.environ['RUNNER_TEMP']+'/otool.txt').read()
          vals=re.findall(r'\bminos\s+([0-9.]+)', s)
          print('minos_values=', vals)
          if not vals or any(tuple(map(int,v.split('.'))) > (15,0) for v in vals):
              raise SystemExit('binary is not iOS 15 compatible')
          PY
          mkdir -p "$GITHUB_WORKSPACE/out/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/out/Payload/"
          rm -rf "$GITHUB_WORKSPACE/out/Payload/MusicManager.app/_CodeSignature" || true
          rm -f "$GITHUB_WORKSPACE/out/Payload/MusicManager.app/embedded.mobileprovision" || true
          cd "$GITHUB_WORKSPACE/out"
          ditto -c -k --sequesterRsrc --keepParent Payload ByeTunes-REAL-iOS15-unsigned.ipa
          shasum -a 256 ByeTunes-REAL-iOS15-unsigned.ipa | tee sha256.txt

      - name: Upload real ByeTunes IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeTunes-REAL-iOS15-${{ github.run_id }}
          path: |
            out/ByeTunes-REAL-iOS15-unsigned.ipa
            out/sha256.txt
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/otool.txt
            ${{ runner.temp }}/ios15-source.patch
          if-no-files-found: ignore
          retention-days: 14
